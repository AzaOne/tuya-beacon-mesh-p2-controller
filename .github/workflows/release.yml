name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test and build release binaries
        run: ./build.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/tuya-beacon-mesh-p2-controller-linux-amd64
            build/tuya-beacon-mesh-p2-controller-linux-arm64
            build/tuya-beacon-mesh-p2-controller-server-linux-amd64
            build/tuya-beacon-mesh-p2-controller-server-linux-arm64
